[package]
name = "ig-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ideagit"
path = "src/main.rs"

[features]
# `cargo xtask screenshots`: headless rendering of the Log to PNG (GPUI test support; macOS only).
screenshots = ["gpui/test-support", "gpui_platform/test-support", "dep:image"]

[dependencies]
ig-git = { path = "../ig-git" }
ig-log = { path = "../ig-log" }
ig-ui-kit = { path = "../ig-ui-kit" }
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
# All of the following are already in GPUI's dependency tree (same versions): no new crates.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
flume = "0.12"
log = "0.4"
lyon = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
